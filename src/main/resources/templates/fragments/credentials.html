<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="list" id="credential-list"
     hx-get="/fragments/credentials" hx-trigger="credentialsChanged from:body" hx-swap="outerHTML">

    <p class="mb-3 text-sm text-slate-500">
        <span th:text="${userCount}">0</span> usuário(s),
        <span th:text="${#lists.size(credentials)}">0</span> passkey(s) em memória.
    </p>

    <p th:if="${#lists.isEmpty(credentials)}" class="rounded border border-dashed border-slate-300 p-6 text-center text-sm text-slate-500">
        Nenhuma passkey registrada ainda.
    </p>

    <div th:unless="${#lists.isEmpty(credentials)}" class="overflow-x-auto">
        <table class="min-w-full text-left text-sm">
            <thead class="border-b bg-slate-50 text-xs uppercase text-slate-500">
            <tr>
                <th class="px-3 py-2">Usuário</th>
                <th class="px-3 py-2">Passkey</th>
                <th class="px-3 py-2">Autenticador</th>
                <th class="px-3 py-2">Flags</th>
                <th class="px-3 py-2">signCount</th>
                <th class="px-3 py-2">Datas</th>
                <th class="px-3 py-2"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${credentials}" class="border-b align-top last:border-0"
                th:classappend="${c.username == currentUser} ? 'bg-emerald-50'">
                <td class="px-3 py-2 font-medium" th:text="${c.username}">maria</td>
                <td class="px-3 py-2">
                    <div th:text="${c.nickname}">MacBook</div>
                    <code class="text-xs text-slate-500" th:title="${c.credentialId}"
                          th:text="${@fmt.shorten(c.credentialId)}">abc…</code>
                </td>
                <td class="px-3 py-2 text-xs">
                    <div th:text="${c.kind}">Sincronizável</div>
                    <div class="text-slate-500">alg: <span th:text="${c.algorithm}">ES256</span></div>
                    <div class="text-slate-500">atestação: <span th:text="${c.attestationFormat}">none</span></div>
                    <div class="text-slate-500" th:title="${c.aaguid}">AAGUID: <span th:text="${@fmt.shorten(c.aaguid)}">0000</span></div>
                    <div class="text-slate-500">transports:
                        <span th:text="${#lists.isEmpty(c.transports)} ? '-' : ${#strings.listJoin(c.transports, ', ')}">internal</span>
                    </div>
                </td>
                <td class="px-3 py-2 text-xs">
                    <span th:each="flag : ${ {
                            {'BE', c.backupEligible, 'Backup elegível: a passkey pode ser sincronizada'},
                            {'BS', c.backedUp, 'Backup feito: a passkey está sincronizada'},
                            {'UV', c.uvInitialized, 'Verificação do usuário já foi feita com esta passkey'} } }"
                          class="mr-1 inline-block rounded px-1.5 py-0.5 font-mono"
                          th:classappend="${flag[1]} ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'"
                          th:title="${flag[2]}" th:text="${flag[0]}">BE</span>
                </td>
                <td class="px-3 py-2 font-mono" th:text="${c.signCount}">0</td>
                <td class="px-3 py-2 text-xs text-slate-500">
                    <div>criada: <span th:text="${@fmt.dateTime(c.createdAt)}">-</span></div>
                    <div>último uso: <span th:text="${@fmt.dateTime(c.lastUsedAt)}">-</span></div>
                </td>
                <td class="px-3 py-2 text-right">
                    <button class="rounded px-2 py-1 text-xs text-red-600 ring-1 ring-red-200 hover:bg-red-50"
                            th:attr="hx-delete=@{/credentials/{id}(id=${c.credentialId})}"
                            hx-target="#credential-list" hx-swap="outerHTML"
                            hx-confirm="Remover esta passkey do servidor? Ela continuará no seu autenticador, mas não será mais aceita aqui.">
                        Remover
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
