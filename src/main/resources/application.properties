spring.application.name=passkeydemo

# ---------------------------------------------------------------------------
# Relying Party (RP) - explicação detalhada de cada opção em PASSKEYS.md
# ---------------------------------------------------------------------------
# Domínio ao qual as passkeys ficam vinculadas. Precisa ser igual ao domínio da página
# ou um "sufixo registrável" dele (ex.: login.exemplo.com.br pode usar exemplo.com.br).
passkey.rp-id=localhost
# Nome exibido pelo navegador/autenticador ao criar a passkey.
passkey.rp-name=Passkey Demo
# Origens aceitas (esquema://host:porta). Separe várias com vírgula.
passkey.origins=http://localhost:8080
# Tempo que o navegador espera pelo usuário e validade do challenge no servidor.
passkey.timeout=120s
# required | preferred | discouraged
passkey.user-verification=preferred
# required | preferred | discouraged  (credencial descobrível / "resident key")
passkey.resident-key=required
# none | indirect | direct | enterprise
passkey.attestation=none
# vazio (qualquer) | platform | cross-platform
passkey.authenticator-attachment=
# Algoritmos COSE aceitos em ordem de preferência: -7 ES256, -8 EdDSA, -257 RS256
passkey.algorithms=-7,-8,-257

# ---------------------------------------------------------------------------
# Logs
# ---------------------------------------------------------------------------
logging.level.io.github.tonyblack10.passkeydemo=DEBUG
logging.level.com.webauthn4j=DEBUG
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{requestId:-        }]){magenta} %clr(%-45.45logger{44}){cyan} : %m%n%wEx

# ---------------------------------------------------------------------------
# Sessão HTTP (guarda o challenge pendente e o usuário autenticado)
# ---------------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# Expõe apenas health e info no Actuator.
management.endpoints.web.exposure.include=health,info

spring.thymeleaf.cache=false
# Evita o log duplicado "Resolved [...]": o ApiExceptionHandler já registra os erros.
spring.mvc.log-resolved-exception=false
